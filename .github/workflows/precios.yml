name: Actualizar precios de hormonas

on:
  schedule:
    # 7:17 y 19:17 hora de Venezuela (UTC-4). El BCV publica la tasa del día siguiente por la tarde.
    - cron: '17 11,23 * * *'
  workflow_dispatch: {}
  push:
    paths:
      - 'scripts/actualizar-precios.mjs'
      - 'data/fuentes.json'
      - '.github/workflows/precios.yml'

permissions:
  contents: write

concurrency:
  group: precios
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Consultar tasa BCV y precios de farmacias
        run: node scripts/actualizar-precios.mjs

      - name: Guardar cambios
        run: |
          if git diff --quiet -- data/precios.json; then
            echo "Sin cambios en los precios."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/precios.json
          git commit -m "chore: actualizar precios de hormonas y tasa BCV"
          git push
