name: Actualizar precios de hormonas

on:
  schedule:
    # 7:17 y 19:17 hora de Venezuela (UTC-4). El BCV publica la tasa del día siguiente por la tarde.
    - cron: '17 11,23 * * *'
  workflow_dispatch: {}
  push:
    paths:
      - 'scripts/actualizar-precios.mjs'
      - 'data/fuentes.json'
      - '.github/workflows/precios.yml'

permissions:
  contents: write

concurrency:
  group: precios
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # bcv.org.ve no envía el certificado intermedio de su cadena TLS. Se descarga desde la
      # dirección "CA Issuers" de su propio certificado para que la conexión siga verificada.
      # Si algo falla, el script usa la tasa oficial publicada por ve.dolarapi.com.
      - name: Completar la cadena de certificados del BCV
        continue-on-error: true
        run: |
          echo | openssl s_client -connect www.bcv.org.ve:443 -servername www.bcv.org.ve 2>/dev/null \
            | openssl x509 -out "$RUNNER_TEMP/bcv-hoja.pem"
          url=$(openssl x509 -in "$RUNNER_TEMP/bcv-hoja.pem" -noout -ext authorityInfoAccess \
            | sed -n 's/.*CA Issuers - URI:\(.*\)/\1/p' | head -n1)
          echo "Intermedio: $url"
          curl -fsSL "$url" -o "$RUNNER_TEMP/bcv-intermedio.cer"
          openssl x509 -inform DER -in "$RUNNER_TEMP/bcv-intermedio.cer" -out "$RUNNER_TEMP/bcv-intermedio.pem" \
            || openssl x509 -in "$RUNNER_TEMP/bcv-intermedio.cer" -out "$RUNNER_TEMP/bcv-intermedio.pem"
          echo "NODE_EXTRA_CA_CERTS=$RUNNER_TEMP/bcv-intermedio.pem" >> "$GITHUB_ENV"

      - name: Consultar tasa BCV y precios de farmacias
        run: node scripts/actualizar-precios.mjs

      - name: Guardar cambios
        run: |
          if git diff --quiet -- data/precios.json; then
            echo "Sin cambios en los precios."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/precios.json
          git commit -m "chore: actualizar precios de hormonas y tasa BCV"
          git push
