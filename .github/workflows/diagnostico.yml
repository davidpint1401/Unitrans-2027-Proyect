name: Diagnóstico del registro (temporal)

on:
  push:
    branches: [claude/jolly-bell-8tktgj]
    paths: ['.github/workflows/diagnostico.yml']

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - name: Envío con los campos ocultos del formulario (se detiene en el primero aceptado)
        run: |
          FORM="https://docs.google.com/forms/d/e/1FAIpQLSdtpMTkAnMtqpmvA0tcirgAL3okOtXZBCxzfw0XreKmvx6rZQ"
          curl -s -c jar.txt "$FORM/viewform" -o view.html
          node -e '
            const h = require("fs").readFileSync("view.html", "utf8");
            const ocultos = [...h.matchAll(/<input[^>]*type="hidden"[^>]*>/g)].map(m => m[0]);
            const pares = ocultos.map(i => [ (i.match(/name="([^"]*)"/)||[])[1], ((i.match(/value="([^"]*)"/)||[])[1]||"").replace(/&quot;/g, "\"").replace(/&amp;/g, "&") ]).filter(p => p[0]);
            console.log("OCULTOS:", JSON.stringify(pares));
            require("fs").writeFileSync("ocultos.txt", pares.map(([k,v]) => k + "=" + encodeURIComponent(v)).join("&"));
          '
          ENTRADAS="entry.1045781291=fundaunitrans2020%40gmail.com&entry.2005620554=PRUEBA%20WEB&entry.226430101=BORRAR&entry.345884997=Intersex&entry.1013692133=No%20Binario&entry.1498399976=30&entry.1065046570=Prueba&entry.1166974658=04140000000&entry.1060290331=S%C3%B3lo%20atenci%C3%B3n%20Psicol%C3%B3gica"
          probar () {
            code=$(curl -s -b jar.txt -o r.html -w "%{http_code}" -H "Content-Type: application/x-www-form-urlencoded" --data "$2" "$FORM/formResponse")
            echo "== $1 → HTTP $code"; [ "$code" = "200" ]
          }
          OC=$(cat ocultos.txt)
          probar "E: ocultos + emailAddress + entradas" "$OC&emailAddress=fundaunitrans2020%40gmail.com&$ENTRADAS" && exit 0
          probar "F: entradas + emailAddress (sin ocultos)" "emailAddress=fundaunitrans2020%40gmail.com&$ENTRADAS" && exit 0
          echo "Ninguna aceptada"
