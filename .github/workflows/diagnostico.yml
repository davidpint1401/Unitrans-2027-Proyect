name: Diagnóstico del registro (temporal)

on:
  push:
    branches: [claude/jolly-bell-8tktgj]
    paths: ['.github/workflows/diagnostico.yml']

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - name: Un envío de prueba al Google Form (mismos datos que manda la web)
        run: |
          curl -s -o resp.html -w "HTTP %{http_code}\n" \
            -H "Content-Type: application/x-www-form-urlencoded;charset=UTF-8" \
            --data-urlencode "emailAddress=prueba-web@example.com" \
            --data-urlencode "entry.1045781291=prueba-web@example.com" \
            --data-urlencode "entry.2005620554=PRUEBA WEB" \
            --data-urlencode "entry.226430101=BORRAR" \
            --data-urlencode "entry.345884997=Intersex" \
            --data-urlencode "entry.1013692133=No Binario" \
            --data-urlencode "entry.1498399976=30" \
            --data-urlencode "entry.1065046570=Prueba" \
            --data-urlencode "entry.1166974658=0000000000" \
            --data-urlencode "entry.1060290331=Sólo atención Psicológica" \
            "https://docs.google.com/forms/d/e/1FAIpQLSdtpMTkAnMtqpmvA0tcirgAL3okOtXZBCxzfw0XreKmvx6rZQ/formResponse"
          grep -o '<title>[^<]*</title>' resp.html || true
          grep -o 'freebirdFormviewerViewResponseConfirmationMessage[^<]*<[^<]*' resp.html | head -1 || true
          grep -oi 'Se ha registrado tu respuesta\|Your response has been recorded\|Esta pregunta es obligatoria\|This is a required question\|ServiceLogin' resp.html | sort | uniq -c || true
